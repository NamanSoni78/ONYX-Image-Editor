<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onyx — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .card {
      padding: 3rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      background: rgba(19, 19, 22, 0.7);
      max-width: 22rem;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 0.5rem;
    }
    p {
      color: #a1a1aa;
      font-size: 0.875rem;
      line-height: 1.6;
      margin: 0;
    }
    a {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.625rem 1.25rem;
      border-radius: 9999px;
      background: linear-gradient(100deg, #6366f1, #8b5cf6);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>The page you wanted isn't cached yet. Your saved projects and the editor shell may still be available.</p>
    <a href="/editor">Open editor</a>
  </div>
</body>
</html>
